services:
  postgres:
    image: postgres:16-alpine
    container_name: kas-kelas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kas_kelas
    ports:
      - "5432:5432"
    volumes:
      - kas_kelas_pgdata:/var/lib/postgresql/data

volumes:
  kas_kelas_pgdata:
